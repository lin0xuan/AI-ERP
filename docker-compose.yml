# 只启动 MySQL 和 Redis。后端和 Vue 3 前端仍在本机运行。
# 首次启动会执行 docs/qihang-erp.sql。已有数据卷时不会重复导入。
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-changeme}
      MYSQL_DATABASE: qihang-erp
    ports:
      - "3306:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - erp-mysql:/var/lib/mysql
      - ./docs/qihang-erp.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./docs/migrations/20260910_add_amazon_shopify.sql:/docker-entrypoint-initdb.d/02-amazon-shopify.sql:ro
      - ./docs/migrations/20261119_ai_memory.sql:/docker-entrypoint-initdb.d/03-ai-memory.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - erp-redis:/data

volumes:
  erp-mysql:
  erp-redis:
