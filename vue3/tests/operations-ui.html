<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>业务工作台验收</title></head><body style="margin:0"><div style="padding:10px;background:#fff3cd">界面验收：合成数据，不连接业务库或模型。</div><div id="app"></div><script type="module">
import {createApp} from 'vue';import {createPinia} from 'pinia';import ElementPlus from 'element-plus';import 'element-plus/dist/index.css';import Page from '/src/views/operations/index.vue';import request from '/src/utils/request';import {useUserStore} from '/src/store/modules/user';
const pinia=createPinia();useUserStore(pinia).permissions=['*:*:*'];
const inventory=[{id:1,sku_code:'SKU-001',goods_name:'测试棉质衬衫',warehouse_id:1,quantity:25,locked_quantity:5,available_quantity:20,stock_value:1250},{id:2,sku_code:'SKU-002',goods_name:'测试运动外套',warehouse_id:2,quantity:8,locked_quantity:0,available_quantity:8,stock_value:null}];
const docs=[{id:'fixture-receipt-001',kind:'RECEIPT',inventory_id:1,quantity:10,received_quantity:0,unit_cost:50,extra_cost:20,created_by:2,state:'PENDING',first_permission:'erp:operations:approve',second_permission:null,version:1,reason:'采购入库核对',attributes_json:'{}',history:[{id:1,actor_id:2,action:'CREATE',created_at:Date.now(),detail:'创建采购入库草稿'}]}];
const grants=[{user_id:2,merchant_id:1,shop_id:1,warehouse_id:-1}];const fieldDefinitions=[];
request.defaults.adapter=async config=>{const path=config.url.split('/operations/')[1],body=typeof config.data==='string'?JSON.parse(config.data):config.data||{},p=config.params||{};let data=[];
if(path==='inventory')data=inventory;
else if(path==='documents'&&config.method==='post'){const d={...body,id:crypto.randomUUID(),inventory_id:body.inventoryId,state:'DRAFT',version:0,created_by:1,attributes_json:JSON.stringify(body.attributes),history:[]};docs.push(d);data=d}
else if(path==='documents')data=docs;
else if(path?.includes('/actions')){const d=docs.find(d=>path.includes(d.id));d.state=({approve:'APPROVED',post:'POSTED',cancel:'CANCELLED',reject:'REJECTED',submit:'PENDING'})[body.action];d.version++;data=d}
else if(path?.startsWith('documents/'))data=docs.find(d=>path.endsWith(d.id));
else if(path?.startsWith('ledger/'))data=[{source:'采购入库 PR-001',quantity_delta:25,locked_delta:0,quantity_after:25,value_after:1250,actor:'仓库员',reason:'采购到货验收',created_at:Date.now()}];
else if(path==='replenishment')data=[{inventory_id:1,sku_code:'SKU-001',available_quantity:20,open_purchase_quantity:0,projected_quantity:20,effective_reorder_point:30,suggested_quantity:40,reorder_point:30,target_quantity:60,min_order:10,pack_size:10,lead_days:7,daily_demand:4,supplier_id:1,unit_cost:50,enabled:1,version:1}];
else if(path==='policies')data=['RECEIPT','PURCHASE','ISSUE','ADJUSTMENT','VALUATION','TRANSFER'].map(kind=>({kind,threshold_amount:10000,first_permission:'erp:operations:approve',second_permission:'erp:operations:finance',version:0}));
else if(path==='grants')data=grants;
else if(path==='fields'&&config.method==='put'){fieldDefinitions.push({field_key:body.key,label:body.label,field_type:body.type,required_flag:body.required?1:0,options_json:JSON.stringify(body.options),kind:body.kind});data={}}
else if(path==='fields')data=fieldDefinitions.filter(f=>f.kind===p.kind);
else if(path==='master')data={kind:p.kind,recordId:p.recordId,version:0,fields:fieldDefinitions.filter(f=>f.kind===p.kind),attributes:{}};
return {data:{code:200,data:JSON.parse(JSON.stringify(data))},status:200,statusText:'OK',headers:{},config};};
createApp(Page).use(pinia).use(ElementPlus).mount('#app');
</script></body></html>
